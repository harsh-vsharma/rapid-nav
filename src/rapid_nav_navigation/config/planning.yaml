amcl:
  ros__parameters:
    use_sim_time: true
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
    laser_model_type: "likelihood_field"
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    laser_max_range: 12.0
    set_initial_pose: true
    tf_broadcast: true
    transform_tolerance: 0.5

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["RapidAStar", "RapidAStarSmooth", "RapidDijkstra", "RapidThetaStar", "NavFn", "Smac2D", "NavThetaStar"]
    RapidAStar:
      plugin: "rapid_nav_planner::GridPlanner"
      algorithm: "astar"
      cost_weight: 2.0
      heuristic_weight: 1.0
      lethal_cost: 253
      allow_unknown: true
      smooth: false
      smooth_tolerance: 0.1
      path_resolution: 0.05
      max_planning_time: 2.0
    RapidAStarSmooth:
      plugin: "rapid_nav_planner::GridPlanner"
      algorithm: "astar"
      cost_weight: 2.0
      heuristic_weight: 1.0
      lethal_cost: 253
      allow_unknown: true
      smooth: true
      smooth_tolerance: 0.1
      path_resolution: 0.05
      max_planning_time: 2.0
    RapidDijkstra:
      plugin: "rapid_nav_planner::GridPlanner"
      algorithm: "dijkstra"
      cost_weight: 2.0
      heuristic_weight: 1.0
      lethal_cost: 253
      allow_unknown: true
      smooth: false
      smooth_tolerance: 0.1
      path_resolution: 0.05
      max_planning_time: 2.0
    RapidThetaStar:
      plugin: "rapid_nav_planner::GridPlanner"
      algorithm: "theta_star"
      cost_weight: 2.0
      heuristic_weight: 1.0
      lethal_cost: 253
      allow_unknown: true
      smooth: false
      smooth_tolerance: 0.1
      path_resolution: 0.05
      max_planning_time: 2.0
    NavFn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: false
      allow_unknown: true
    Smac2D:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      allow_unknown: true
      cost_travel_multiplier: 2.0
    NavThetaStar:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 1.0
      publish_frequency: 1.0
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
