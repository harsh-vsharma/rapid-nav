# The navigation stack: the planning stack (map server, AMCL, planner server with seven planners)
# plus the controller, behaviour and BT navigator servers, under one lifecycle manager.
#
# The controller server reads one block as its controller: FollowPath_dwa (our DWA controller),
# FollowPath_dwb (Nav2's DWB) or FollowPath_rpp (Regulated Pure Pursuit). The launch copies the
# chosen block into FollowPath. Only the block named FollowPath is read by the controller server.

amcl:
  ros__parameters:
    use_sim_time: true
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
    laser_model_type: "likelihood_field"
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    laser_max_range: 12.0
    set_initial_pose: true
    tf_broadcast: true
    transform_tolerance: 0.5

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["RapidAStar", "RapidAStarSmooth", "RapidDijkstra", "RapidThetaStar", "NavFn", "Smac2D", "NavThetaStar"]
    RapidAStar:
      plugin: "rapid_nav_planner::GridPlanner"
      algorithm: "astar"
      cost_weight: 2.0
      heuristic_weight: 1.0
      lethal_cost: 253
      allow_unknown: true
      smooth: false
      smooth_tolerance: 0.1
      path_resolution: 0.05
      max_planning_time: 2.0
    RapidAStarSmooth:
      plugin: "rapid_nav_planner::GridPlanner"
      algorithm: "astar"
      cost_weight: 2.0
      heuristic_weight: 1.0
      lethal_cost: 253
      allow_unknown: true
      smooth: true
      smooth_tolerance: 0.1
      path_resolution: 0.05
      max_planning_time: 2.0
    RapidDijkstra:
      plugin: "rapid_nav_planner::GridPlanner"
      algorithm: "dijkstra"
      cost_weight: 2.0
      heuristic_weight: 1.0
      lethal_cost: 253
      allow_unknown: true
      smooth: false
      smooth_tolerance: 0.1
      path_resolution: 0.05
      max_planning_time: 2.0
    RapidThetaStar:
      plugin: "rapid_nav_planner::GridPlanner"
      algorithm: "theta_star"
      cost_weight: 2.0
      heuristic_weight: 1.0
      lethal_cost: 253
      allow_unknown: true
      smooth: false
      smooth_tolerance: 0.1
      path_resolution: 0.05
      max_planning_time: 2.0
    NavFn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: false
      allow_unknown: true
    Smac2D:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      allow_unknown: true
      cost_travel_multiplier: 2.0
    NavThetaStar:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 1.0
      publish_frequency: 1.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      hazard_layer:
        plugin: "rapid_nav_hazard::HazardLayer"
        enabled: true
        topic: /obstacles/tracked
        horizon_s: 2.0
        time_step_s: 0.25
        robot_radius: 0.25
        margin: 0.05
        max_cost: 252
        min_cost: 60
        min_speed: 0.05
        max_age_s: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.25
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      hazard_layer:
        plugin: "rapid_nav_hazard::HazardLayer"
        enabled: true
        topic: /obstacles/tracked
        horizon_s: 2.0
        time_step_s: 0.25
        robot_radius: 0.25
        margin: 0.05
        max_cost: 252
        min_cost: 60
        min_speed: 0.05
        max_age_s: 0.5

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: true

    # Our DWA controller (rapid_nav_controller::DwaController): the robot's limits, the window, the
    # rollout, the critics' weights and the path handling.
    FollowPath_dwa:
      plugin: "rapid_nav_controller::DwaController"
      transform_tolerance: 0.2
      max_vel_x: 0.5
      min_vel_x: 0.0
      max_vel_theta: 1.5
      acc_lim_x: 0.8
      acc_lim_theta: 2.5
      vx_samples: 11
      wz_samples: 21
      sim_time: 1.5
      sim_step: 0.1
      lookahead: 1.0
      rotate_to_heading_angle: 0.8
      rotate_gain: 1.5
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      path_distance_weight: 32.0
      goal_distance_weight: 24.0
      heading_weight: 10.0
      obstacle_weight: 8.0
      speed_weight: 4.0
      lethal_threshold: 253
      publish_trajectories: false

    # Nav2's DWB with the Jazzy critics for a differential robot, and the limits of the robot.
    FollowPath_dwb:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      acc_lim_y: 0.0
      acc_lim_theta: 2.5
      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -2.5
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # The same as the goal checker: a larger value makes DWB stop and turn before the goal
      # checker accepts the position, so the robot halts short of the goal.
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    # Regulated Pure Pursuit: geometric tracking of the path, with the robot's angular limits.
    FollowPath_rpp:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.5
      max_angular_accel: 2.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.5

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    # Milliseconds for an action server to acknowledge a goal. Nav2's 20 ms is short for a loaded
    # machine, and a missed acknowledgement aborts the goal without a recovery.
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # Replaced by the navigation launch with the installed behaviour tree.
    default_nav_to_pose_bt_xml: "navigate_rapid.xml"

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["map_server", "amcl", "planner_server", "controller_server", "behavior_server", "bt_navigator"]
