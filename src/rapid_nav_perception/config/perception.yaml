flow_node:
  ros__parameters:
    use_sim_time: true
    backend: raft_small
    device: auto
    width: 320  # 640 for frame_route (its thresholds are set at 640 x 480)
    max_rate: 10.0
    max_pair_gap: 0.2
    depth_slop: 0.04
    weights_path: ''
    raft_iterations: 12
    num_threads: 0
    publish_vis: true
    # backend: frame_route only.
    # flownet_weights: FlowNetS checkpoint; '' means
    #   $RAPID_NAV_WEIGHTS/flownets/flownets_EPE1.951.pth.tar (RAPID_NAV_WEIGHTS: ~/.cache/rapid_nav)
    # searaft_weights: SEA-RAFT checkpoint, a file or a checkpoint name (downloaded once)
    # A frame is fast when more than route_frac of its pixels move over route_disp_px
    # (10 px at the 640 x 480 processing size, as in the benchmark).
    flownet_weights: ''
    searaft_weights: Tartan-C-T-TSKH432x960-S
    route_disp_px: 10.0
    route_frac: 0.3
    stream_iters: 2
    key_iters: 4
