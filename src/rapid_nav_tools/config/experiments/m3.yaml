# M3: the hybrid. Camera flow alone against lidar and camera fused with uncertainty (risk cost and
# speed governor), with no hazard layer as the baseline. 27 runs at RTF 0.25, about 6 h in Docker.
# The governor ablation (fused without it) is run with nav-smoke ... fused --no-governor.
name: m3
rtf: 0.25
scenarios: [crossing, head_on, crowd]
controllers: [dwb]
hazards: ["off", flow, fused]
repeats: 3
seed: 7
track_check: false
