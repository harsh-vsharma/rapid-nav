name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}-ros-base
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths src --ignore-src -y --rosdistro ${{ matrix.distro }}

      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: Test
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose
